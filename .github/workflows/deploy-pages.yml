name: Deploy karaoke to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate static site
        run: |
          test -s index.html
          test -s style.css
          test -s karaoke.js
          test -s assets/song.enhanced.lrc
          echo "Static karaoke page and Enhanced LRC are ready."
          if [ ! -s assets/song.mp3 ]; then
            echo "::warning::assets/song.mp3 is not in the repository yet. The page can still be opened, but playback needs the MP3 asset."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
