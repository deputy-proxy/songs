name: Deploy karaoke to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch uploaded song from Suno CDN
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p assets
          if [ -s assets/song.mp3 ]; then
            echo "Song asset already exists."
            exit 0
          fi
          if ! curl --fail --location --silent --show-error --retry 2 --connect-timeout 20 --max-time 120 \
            "https://cdn1.suno.ai/b60e8568-4ad5-4b42-b532-e471d5fa2b91.mp3" \
            --output assets/song.mp3; then
            rm -f assets/song.mp3
            echo "::warning::Suno public CDN did not provide this uploaded file; audio remains a local-file option."
            exit 1
          fi
          test -s assets/song.mp3
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/song.mp3
          git commit -m "chore: add uploaded song audio"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Validate static site
        run: |
          test -s index.html
          test -s style.css
          test -s karaoke.js
          test -s assets/song.enhanced.lrc
          echo "Static karaoke page and Enhanced LRC are ready."
          if [ ! -s assets/song.mp3 ]; then
            echo "::warning::assets/song.mp3 is not in the repository yet. The page can still be opened, but playback needs the MP3 asset."
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
